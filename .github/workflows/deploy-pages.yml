name: Deploy Pages

on:
  push:
    # `dev` is the working branch, so it is what the preview site reflects.
    # Deliberately not [main, dev]: both branches publish to the same URL, so
    # whichever finishes last wins, and a push to a stale main would quietly
    # replace the preview. Switch this to main when main becomes the release
    # branch.
    branches: [dev]
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deployment; don't cancel a run that is mid-deploy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        # BASE_PATH makes asset URLs resolve under /<repo-name>/ on project Pages
        run: npm run build:site
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # Requires Pages to be enabled once, by hand:
      #   Settings -> Pages -> Source -> GitHub Actions
      #
      # `enablement: true` looks like it would automate that, but it cannot:
      # creating a Pages site needs a token with repo scope, and the workflow's
      # GITHUB_TOKEN is refused with "Create Pages site failed. Resource not
      # accessible by integration". Left at the default so the failure message
      # names the real, actionable cause.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
